<style>
  :root {
    --bg:      #0f1117;
    --surface: #1a1d27;
    --border:  #2a2d3a;
    --accent:  #7c6af7;
    --text:    #e2e4ef;
    --muted:   #6b7280;
    --link:    #a59df8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; }
  #search {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    padding: 8px 14px;
    outline: none;
    transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }
  #count {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
    padding: 20px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px;
    transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-title {
    font-size: 14px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-title a {
    color: var(--link);
    text-decoration: none;
  }
  .card-title a:hover { text-decoration: underline; }
  .card-owner { font-size: 12px; color: var(--muted); }
  .card-desc {
    font-size: 13px;
    color: #9ca3af;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 2px;
  }
  .card-freshness {
    font-size: 11px;
    color: var(--muted);
    display: flex; align-items: center; gap: 3px;
  }
  .card-freshness svg { opacity: .65; }
  .hidden { display: none; }
  #empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 15px;
  }
</style>
</head>

function timeAgo(iso) {
  if (!iso) return '';
  const secs = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (secs < 60)              return 'just now';
  if (secs < 3600)            return Math.floor(secs / 60)        + 'm ago';
  if (secs < 86400)           return Math.floor(secs / 3600)      + 'h ago';
  if (secs < 86400 * 30)      return Math.floor(secs / 86400)     + 'd ago';
  if (secs < 86400 * 365)     return Math.floor(secs / (86400*30))+ ' months ago';
  return Math.floor(secs / (86400 * 365)) + ' years ago';
}

const CLOCK_ICON =
  `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">` +
  `<circle cx="8" cy="8" r="7"/><path d="M8 4v4l2.5 2.5"/>` +
  `</svg>`;

// Build cards once
const cards = DATA.map((r, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  const freshness = r.pushed_at
    ? `<div class="card-freshness">${CLOCK_ICON} ${timeAgo(r.pushed_at)}</div>`
    : '';
  card.innerHTML =
    `<div class="card-title"><a href="${r.url}" target="_blank" rel="noopener">${esc(r.name)}</a></div>` +
    `<div class="card-owner">${esc(r.owner)}</div>` +
    (r.desc ? `<div class="card-desc">${esc(r.desc)}</div>` : '') +
    (freshness ? `<div class="card-meta">${freshness}</div>` : '');
  card._needle = (r.name + ' ' + r.owner + ' ' + r.desc).toLowerCase();
  grid.appendChild(card);
  return card;
});

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  let shown = 0;
  cards.forEach(card => {
    const match = terms.length === 0 || terms.every(t => card._needle.includes(t));
    card.classList.toggle('hidden', !match);
    if (match) shown++;
  });
  count.textContent = q ? `${shown} / ${total} repos` : `${total} repos`;
  empty.classList.toggle('hidden', shown > 0);
});
</script>
</body>
</html>
